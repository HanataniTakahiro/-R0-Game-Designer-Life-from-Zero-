<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>重生之我要当顶级策划</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0e1a;
  --bg2: #111827;
  --bg3: #1a2133;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --gold: #f0c040;
  --green: #22c55e;
  --red: #ef4444;
  --orange: #f59e0b;
  --blue: #3b82f6;
}

html, body { width: 100%; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; overflow: hidden; height: 100%; }

#app { width: 100%; max-width: 480px; margin: 0 auto; height: 100vh; position: relative; }

/* ========== Opening ========== */
#opening {
  position: fixed; inset: 0; background: #05080f; z-index: 1000;
  display: flex; align-items: center; justify-content: center; padding: 30px;
  opacity: 0; transition: opacity 0.5s; pointer-events: none;
}
#opening.show { opacity: 1; pointer-events: auto; }
#opening.hide { opacity: 0; pointer-events: none; }
.opening-text {
  font-size: 15px; line-height: 2; color: var(--text2); max-width: 400px;
  white-space: pre-wrap; min-height: 200px;
}
.opening-text .cursor { display: inline-block; width: 2px; height: 1em; background: var(--gold); animation: blink 0.8s infinite; vertical-align: text-bottom; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
.opening-skip { position: fixed; bottom: 30px; right: 30px; color: var(--text2); font-size: 13px; cursor: pointer; background: none; border: 1px solid #333; padding: 6px 16px; border-radius: 20px; }
.opening-skip:hover { border-color: var(--gold); color: var(--gold); }

/* ========== Title ========== */
#title {
  position: fixed; inset: 0; background: var(--bg); z-index: 900;
  display: none; align-items: center; justify-content: center;
  flex-direction: column; padding: 30px; text-align: center;
}
#title.show { display: flex; animation: fadeIn 0.6s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.title-main {
  font-size: 32px; font-weight: 900; color: var(--gold);
  text-shadow: 0 0 30px rgba(255,215,0,0.25);
  margin-bottom: 8px; letter-spacing: 3px;
}
.title-sub { font-size: 13px; color: var(--text2); margin-bottom: 30px; line-height: 1.6; }
.name-label { font-size: 15px; margin-bottom: 10px; }
.name-input {
  background: var(--bg3); border: 2px solid var(--gold); border-radius: 10px;
  padding: 10px 18px; font-size: 16px; color: var(--text); text-align: center;
  width: 260px; outline: none; margin-bottom: 20px;
}
.name-input:focus { box-shadow: 0 0 15px rgba(255,215,0,0.15); }
.btn-start {
  background: linear-gradient(135deg, var(--gold), #d4a800);
  border: none; border-radius: 10px; padding: 12px 40px;
  font-size: 18px; font-weight: 700; color: #1a1a2e;
  cursor: pointer; transition: all 0.2s; letter-spacing: 2px;
}
.btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255,215,0,0.3); }

/* ========== Game ========== */
#game {
  display: none; height: 100dvh; padding: 12px 12px 0;
  flex-direction: column; overflow-y: auto;
}
#game.show { display: flex; }

.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; background: var(--bg2); border-radius: 10px;
  margin-bottom: 8px; border: 1px solid rgba(255,215,0,0.08);
}
.top-bar .title { font-size: 13px; font-weight: 700; color: var(--gold); }
.top-bar .info { font-size: 12px; color: var(--text2); }

/* Dashboard */
.dashboard {
  display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
  margin-bottom: 8px;
}
.metric {
  background: var(--bg2); border-radius: 8px; padding: 6px 10px;
  border: 1px solid rgba(255,255,255,0.04);
}
.metric .label { font-size: 10px; color: var(--text2); }
.metric .value { font-size: 16px; font-weight: 700; margin-top: 1px; }
.metric .bar-bg { height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; margin-top: 3px; overflow: hidden; }
.metric .bar { height: 100%; border-radius: 2px; transition: width 0.5s; }
.bar-dau { background: linear-gradient(90deg, var(--gold), #ffd700); }
.bar-rep { background: linear-gradient(90deg, var(--green), #4ade80); }
.bar-grind { background: linear-gradient(90deg, var(--orange), #f97316); }
.bar-fund { background: linear-gradient(90deg, var(--blue), #60a5fa); }

/* Phase indicator */
.phase-bar {
  display: flex; gap: 4px; margin-bottom: 8px;
  justify-content: center;
}
.phase-dot {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bg3); border: 2px solid #333;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--text2); transition: all 0.3s;
}
.phase-dot.active { border-color: var(--gold); color: var(--gold); }
.phase-dot.done { border-color: var(--green); color: var(--green); background: rgba(34,197,94,0.1); }

/* Proposal Card */
.card-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 4px 0; position: relative;
}
.proposal-card {
  width: 100%; max-width: 400px;
  background: linear-gradient(145deg, #1a2133, #141c2b);
  border-radius: 16px; padding: 28px 24px;
  border: 2px solid rgba(255,255,255,0.06);
  text-align: center;
  transition: transform 0.3s, opacity 0.3s;
  position: relative; overflow: hidden;
  min-height: 280px;
  display: flex; flex-direction: column; justify-content: center;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
}
.proposal-card::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,215,0,0.03), transparent 70%);
  pointer-events: none;
}
.proposal-card .tag {
  font-size: 11px; color: var(--gold); margin-bottom: 12px;
  letter-spacing: 2px; text-transform: uppercase;
}
.proposal-card .title {
  font-size: 22px; font-weight: 700; line-height: 1.4;
  margin-bottom: 16px;
}
.proposal-card .desc {
  font-size: 14px; color: var(--text2); line-height: 1.7;
}
.proposal-card .hint {
  margin-top: 20px; font-size: 12px; color: rgba(255,255,255,0.2);
}
.proposal-card .swipe-hint-mobile {
  display: none; margin-top: 12px; gap: 20px; justify-content: center;
  align-items: center; font-size: 11px; color: rgba(255,255,255,0.15);
}

/* Swipe hint area */
.proposal-card.swipe-left {
  transform: translateX(-120%) rotate(-15deg);
  opacity: 0; border-color: var(--red);
}
.proposal-card.swipe-right {
  transform: translateX(120%) rotate(15deg);
  opacity: 0; border-color: var(--green);
}

/* Buttons */
.swipe-btns {
  display: flex; gap: 12px; padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
  background: var(--bg); z-index: 10;
  flex-shrink: 0;
}
.swipe-btns button {
  flex: 1; padding: 16px 14px; border-radius: 12px; border: none;
  font-size: 17px; font-weight: 700; cursor: pointer;
  transition: all 0.15s; letter-spacing: 1px;
  min-height: 52px;
}
.btn-reject {
  background: rgba(239,68,68,0.12); color: var(--red);
  border: 2px solid rgba(239,68,68,0.25);
}
.btn-reject:hover, .btn-reject:active { background: rgba(239,68,68,0.25); }
.btn-approve {
  background: rgba(34,197,94,0.12); color: var(--green);
  border: 2px solid rgba(34,197,94,0.25);
}
.btn-approve:hover, .btn-approve:active { background: rgba(34,197,94,0.25); }

/* ========== Settlement Overlay ========== */
#settlement {
  position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 800;
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
#settlement.show { display: flex; animation: fadeIn 0.3s; }
.settlement-box {
  background: var(--bg2); border-radius: 16px; padding: 24px;
  width: 100%; max-width: 400px; text-align: center;
  max-height: 90vh; overflow-y: auto;
}
.settlement-box h2 {
  font-size: 20px; color: var(--gold); margin-bottom: 4px;
}
.settlement-box .period {
  font-size: 12px; color: var(--text2); margin-bottom: 16px;
}
.settlement-box .feedback {
  font-size: 14px; color: var(--text2); line-height: 1.8;
  margin-bottom: 16px; padding: 12px; background: var(--bg3);
  border-radius: 10px; text-align: left;
}
.settlement-box .feedback .highlight { color: var(--gold); font-weight: 700; }
.settlement-box .feedback .good { color: var(--green); }
.settlement-box .feedback .bad { color: var(--red); }

.settlement-changes {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  margin-bottom: 16px;
}
.settlement-changes .item {
  background: var(--bg3); border-radius: 8px; padding: 8px;
  font-size: 12px;
}
.settlement-changes .item .num { font-size: 18px; font-weight: 700; margin-top: 2px; }

.btn-continue {
  background: var(--gold); border: none; border-radius: 10px;
  padding: 12px 36px; font-size: 16px; font-weight: 700;
  color: #1a1a2e; cursor: pointer;
}
.btn-continue:hover { transform: translateY(-1px); }

/* ========== Ending ========== */
#ending {
  position: fixed; inset: 0; background: var(--bg); z-index: 1000;
  display: none; align-items: center; justify-content: center;
  flex-direction: column; padding: 24px; text-align: center;
}
#ending.show { display: flex; animation: fadeIn 0.6s; }
.ending-badge { font-size: 56px; margin-bottom: 8px; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.ending-title { font-size: 26px; font-weight: 900; color: var(--gold); margin-bottom: 4px; }
.ending-id { font-size: 11px; color: var(--text2); margin-bottom: 16px; background: var(--bg3); padding: 3px 10px; border-radius: 20px; }
.ending-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; max-width: 340px; margin-bottom: 14px; }
.ending-stat { background: var(--bg2); border-radius: 8px; padding: 8px; border: 1px solid rgba(255,255,255,0.04); }
.ending-stat .label { font-size: 10px; color: var(--text2); }
.ending-stat .value { font-size: 16px; font-weight: 700; margin-top: 1px; }
.ending-desc { font-size: 13px; color: var(--text2); line-height: 1.7; max-width: 340px; margin-bottom: 16px; }
.ending-pct { font-size: 12px; color: var(--text2); margin-bottom: 16px; }
.btn-restart {
  background: linear-gradient(135deg, var(--gold), #d4a800);
  border: none; border-radius: 10px; padding: 10px 32px;
  font-size: 15px; font-weight: 700; color: #1a1a2e; cursor: pointer;
}

	/* ========== Feedback Popup ========== */
#feedback-popup {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 850;
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
#feedback-popup.show { display: flex; animation: fadeIn 0.25s; }
.feedback-box {
  background: var(--bg2); border-radius: 16px; padding: 24px 20px;
  width: 100%; max-width: 380px; text-align: center;
  border: 1px solid rgba(255,255,255,0.06);
}
.feedback-box .fb-icon { font-size: 36px; margin-bottom: 6px; }
.feedback-box .fb-title { font-size: 15px; color: var(--text); font-weight: 700; margin-bottom: 10px; }
.feedback-box .fb-text { font-size: 13px; color: var(--text2); line-height: 1.7; }
.btn-fb-continue {
  margin-top: 16px; background: var(--gold); border: none; border-radius: 8px;
  padding: 8px 28px; font-size: 14px; font-weight: 700; color: #1a1a2e; cursor: pointer;
}
.btn-fb-continue:hover { transform: translateY(-1px); }

/* ========== Responsive ========== */
@media (max-width: 380px) {
  .proposal-card { padding: 20px 16px; min-height: 220px; }
  .proposal-card .title { font-size: 18px; }
  .proposal-card .desc { font-size: 13px; }
  .title-main { font-size: 26px; }
}

/* 手机上显示滑动提示 */
@media (hover: none) and (pointer: coarse) {
  .proposal-card .swipe-hint-mobile { display: flex; }
  .swipe-btns button { padding: 18px 14px; font-size: 16px; }
}
</style>
</head>
<body>
<div id="app">
  <!-- Opening -->
  <div id="opening">
    <div class="opening-text" id="opening-text"></div>
    <button class="opening-skip" onclick="skipOpening()">跳过 →</button>
  </div>

  <!-- Title -->
  <div id="title">
    <div class="title-main">重生之我要当顶级策划</div>
    <div class="title-sub">上一世过于压榨玩家导致关服<br>这一世，你的每个决定都可能改变命运</div>
    <div class="name-label">天才策划的名字是：</div>
    <input class="name-input" id="name-input" type="text" placeholder="输入你的大名" maxlength="8" autocomplete="off">
    <button class="btn-start" onclick="startGame()">开始运营</button>
  </div>

  <!-- Game -->
  <div id="game">
    <div class="top-bar">
      <div class="title">重生之我要当顶级策划</div>
      <div class="info" id="top-info">第 1 阶段</div>
    </div>

    <div class="dashboard">
      <div class="metric">
        <div class="label">日活</div>
        <div class="value" id="m-dau">5,000</div>
        <div class="bar-bg"><div class="bar bar-dau" id="bar-dau"></div></div>
      </div>
      <div class="metric">
        <div class="label">口碑</div>
        <div class="value" id="m-rep">70</div>
        <div class="bar-bg"><div class="bar bar-rep" id="bar-rep"></div></div>
      </div>
      <div class="metric">
        <div class="label">爆肝</div>
        <div class="value" id="m-grind">20</div>
        <div class="bar-bg"><div class="bar bar-grind" id="bar-grind"></div></div>
      </div>
      <div class="metric">
        <div class="label">资金</div>
        <div class="value" id="m-fund">20,000</div>
        <div class="bar-bg"><div class="bar bar-fund" id="bar-fund"></div></div>
      </div>
    </div>

    <div class="phase-bar" id="phase-bar"></div>

    <div class="card-area" id="card-area">
      <div class="proposal-card" id="proposal-card">
        <div class="tag" id="prop-tag">运营提案</div>
        <div class="title" id="prop-title">加载中...</div>
        <div class="desc" id="prop-desc"></div>
        <div class="hint">👆 你的选择将影响游戏走向</div>
        <div class="swipe-hint-mobile">← 左滑拒绝　　右滑同意 →</div>
      </div>
    </div>

    <div class="swipe-btns">
      <button class="btn-reject" onclick="swipe('reject')">✕ 拒绝</button>
      <button class="btn-approve" onclick="swipe('approve')">✓ 同意</button>
    </div>
  </div>

  <!-- Settlement -->
  <div id="settlement">
    <div class="settlement-box" id="settlement-box">
      <h2>📊 运营月报</h2>
      <div class="period" id="settlement-period"></div>
      <div class="feedback" id="settlement-feedback"></div>
      <div class="settlement-changes" id="settlement-changes"></div>
      <button class="btn-continue" onclick="closeSettlement()">继续运营</button>
    </div>
  </div>

  <!-- Feedback Popup -->
  <div id="feedback-popup">
    <div class="feedback-box">
      <div class="fb-icon" id="fb-icon">📢</div>
      <div class="fb-title" id="fb-title"></div>
      <div class="fb-text" id="fb-text"></div>
      <button class="btn-fb-continue" onclick="closeFeedback()">继续</button>
    </div>
  </div>

  <!-- Ending -->
  <div id="ending">
    <div class="ending-badge" id="ending-badge">🌟</div>
    <div class="ending-title" id="ending-title"></div>
    <div class="ending-id" id="ending-id"></div>
    <div class="ending-stats" id="ending-stats"></div>
    <div class="ending-desc" id="ending-desc"></div>
    <div class="ending-pct">该结局达成率: <span style="color:var(--gold);font-weight:700;" id="ending-pct">--</span>%</div>
    <button class="btn-restart" onclick="restartGame()">再来一局</button>
  </div>
</div>

<script src="proposals_100.js"></script>
<script>

// ============================================================
// 状态
// ============================================================
let G = {};

function initState(name) {
  // 合并旧提案(40) + 新提案(NEW_PROPOSALS)
  let combined = [...PROPOSALS, ...(typeof NEW_PROPOSALS !== 'undefined' ? NEW_PROPOSALS : [])];
  let normals = [...combined];
  for (let i = normals.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [normals[i], normals[j]] = [normals[j], normals[i]];
  }

  // 构建40个槽位
  let proposals = new Array(40);
  // rounds 1-20: 前20个普通提案
  for (let i = 0; i < 20; i++) proposals[i] = normals[i];
  // round 21: 银锅锅触发（固定）
  proposals[20] = SILVER_POT_CHAIN[0];
  // rounds 22-25: 预留（触发后填银锅锅后续 或 普通提案）
  proposals[21] = proposals[22] = proposals[23] = proposals[24] = null;
  // rounds 26-40: 接下来15个普通提案
  for (let i = 25; i < 40; i++) proposals[i] = normals[i - 5];

  // 拒绝银锅锅时的替补提案（取normals[35..38]，多余提案后续轮次复用）
  let rejectPool = normals.slice(35, 39);
  while (rejectPool.length < 4) rejectPool.push(normals[rejectPool.length - 4]);

  G = {
    playerName: name || '天才策划',
    round: 0,
    // 总阶段数（每阶段包含 phaseSize 个提案）
    totalRounds: 8,
    // 提案总数（用于内部回合计数）
    proposalCount: 40,
    phaseSize: 5,
    dau: 5000,
    rep: 50,
    grind: 20,
    fund: 20000,
    proposals: proposals,
    _rejectPool: rejectPool,
    _silverPotResolved: false, // 银锅锅触发是否已处理
    _pendingUnlocks: [],      // 待注入的unlock链事件
    history: [],
    currentDau: 0, currentRep: 0, currentGrind: 0, currentFund: 0,
    phaseDecisions: [],
    ended: false,
    showResult: false,
    endingId: null,
  };
}

// ============================================================
// UI渲染
// ============================================================
function renderDash() {
  // 以“阶段”为单位显示：每 phaseSize 个提案为 1 阶段
  let phase = Math.floor(G.round / G.phaseSize);
  document.getElementById('top-info').textContent = `第 ${phase+1}/${G.totalRounds} 阶段 | ${G.playerName}`;
  document.getElementById('m-dau').textContent = formatNum(G.dau);
  document.getElementById('m-rep').textContent = G.rep;
  document.getElementById('m-grind').textContent = G.grind;
  document.getElementById('m-fund').textContent = formatNum(G.fund);
  setBar('bar-dau', Math.min(100, G.dau / 300));
  setBar('bar-rep', G.rep);
  setBar('bar-grind', G.grind);
  setBar('bar-fund', Math.min(100, G.fund / 300));
  renderPhaseBar();
}

function setBar(id, pct) {
  let el = document.getElementById(id);
  if (el) el.style.width = Math.max(0, Math.min(100, pct)) + '%';
}

function formatNum(n) {
  if (n >= 10000) return (n/10000).toFixed(1).replace('.0','') + '万';
  return n.toLocaleString();
}

function renderPhaseBar() {
  let bar = document.getElementById('phase-bar');
  bar.innerHTML = '';
  let inPhase = G.round % G.phaseSize;
  for (let i = 0; i < G.phaseSize; i++) {
    let dot = document.createElement('div');
    dot.className = 'phase-dot';
    if (i < inPhase) dot.classList.add('done');
    else if (i === inPhase) dot.classList.add('active');
    dot.textContent = i + 1;
    bar.appendChild(dot);
  }
}

// 显示提案
function showProposal() {
  // 使用 proposalCount 判断提案是否用尽（内部回合计数）
  if (G.round >= G.proposalCount || G.ended) return;
  renderDash();
  let prop = G.proposals[G.round];
  document.getElementById('prop-tag').textContent = prop.tag;
  document.getElementById('prop-title').textContent = prop.title;
  document.getElementById('prop-desc').textContent = prop.desc;
  // 重置卡片位置
  let card = document.getElementById('proposal-card');
  card.classList.remove('swipe-left', 'swipe-right');
  card.style.transform = '';
  card.style.opacity = '1';
}

// ============================================================
// 滑动/点击决策
// ============================================================
function swipe(choice) {
  if (G.ended || G.showResult || _pendingFeedback) return;
  if (G.round >= G.proposalCount) return;

  let prop = G.proposals[G.round];
  let card = document.getElementById('proposal-card');

  // 动画
  card.classList.add(choice === 'approve' ? 'swipe-right' : 'swipe-left');

  // 记录决策
  let approved = choice === 'approve';
  G.phaseDecisions.push({ prop, approved });

  // ===== 银锅锅触发处理（第21轮，G.round===20） =====
  // 触发事件本身不影响数值，只决定后续4轮的填充
  if (G.round === 20 && !G._silverPotResolved) {
    G._silverPotResolved = true;
    // 填充 slots 21-24（rounds 22-25）
    let fills = approved ? SILVER_POT_CHAIN.slice(1) : G._rejectPool;
    for (let i = 0; i < 4; i++) G.proposals[21 + i] = fills[i];
  } else {
    // 累积变化（支持批准和拒绝双向影响）
    if (approved) {
      G.currentDau += prop.dau ?? 0;
      G.currentRep += prop.rep ?? 0;
      G.currentGrind += prop.grind ?? 0;
      G.currentFund += prop.fund ?? 0;
      if (prop.hiddenEvent) {
        G._pendingHiddenEvents = G._pendingHiddenEvents || [];
        G._pendingHiddenEvents.push(prop.hiddenEvent);
      }
      // unlock链：同意后解锁后续关联事件
      if (prop.unlocks && prop.unlocks.length > 0) {
        G._pendingUnlocks = G._pendingUnlocks || [];
        prop.unlocks.forEach(u => G._pendingUnlocks.push(u));
      }
    } else {
      G.currentDau += prop.rejectDau ?? 0;
      G.currentRep += prop.rejectRep ?? 0;
      G.currentGrind += prop.rejectGrind ?? 0;
      G.currentFund += prop.rejectFund ?? 0;
    }
  }

  G.round++;

  // 检查是否有即时反馈弹窗
  if (prop.feedback) {
    let fbText = approved ? prop.feedback.approve : (prop.feedback.reject || '你做出了你的选择。有时沉默比回应更有力量。');
    setTimeout(() => showFeedback(fbText), 400);
  } else {
    continueAfterSwipe();
  }
}

function continueAfterSwipe() {
  // 注入unlock事件到后续回合
  if (G._pendingUnlocks && G._pendingUnlocks.length > 0) {
    for (let i = G.round; i < G.totalRounds; i++) {
      if (G._pendingUnlocks.length === 0) break;
      if (i === 20) continue; // 跳过银锅锅触发固定位
      // 只替换普通提案位（前半段 rounds 1-19, 后半段 rounds 26+）
      // 银锅锅后续位（22-25）如果已锁定也不替换
      if (i < 21 || i >= 26 || (i >= 21 && i <= 25 && !G._silverPotResolved)) {
        // 检查这个位置是否已有注入的unlock或链事件
        let existing = G.proposals[i];
        let isUnlock = existing && existing._isUnlock;
        let isChain = i >= 21 && i <= 24 && G._silverPotResolved;
        if (!isChain && !isUnlock) {
          let unlock = G._pendingUnlocks.shift();
          unlock._isUnlock = true;
          G.proposals[i] = unlock;
          break; // 每回合只注入一个
        }
      }
    }
  }

  let inPhase = G.round % G.phaseSize;
  let currentPhase = Math.floor(G.round / G.phaseSize);
  if (inPhase === 0 && G.round > 0) {
    setTimeout(() => showSettlement(), 300);
  } else if (currentPhase >= G.totalRounds) {
    // 已完成所有阶段，触发结局判定
    setTimeout(() => determineEnding(), 300);
  } else {
    setTimeout(() => showProposal(), 300);
  }
}

// 即时反馈弹窗
let _pendingFeedback = false;

function showFeedback(text) {
  _pendingFeedback = true;
  document.getElementById('fb-text').textContent = text;
  document.getElementById('feedback-popup').classList.add('show');
}

function closeFeedback() {
  document.getElementById('feedback-popup').classList.remove('show');
  _pendingFeedback = false;
  continueAfterSwipe();
}

// ============================================================
// 结算系统（每5轮）
// ============================================================
function showSettlement() {
  G.showResult = true;
  let phaseDecisions = G.phaseDecisions;
  let approved = phaseDecisions.filter(d => d.approved);
  let rejected = phaseDecisions.filter(d => !d.approved);

  // 优化后的结算：减小提案对增长的直接比例、引入运维成本并微调口碑/爆肝权重
  // 基准增长（每阶段）
  let baseGrowth = 12; // 较保守的基盘增长，避免指数过快膨胀
  // 将提案给的 dau 值按比例折算为增长贡献，避免整数直接作为百分比叠加
  let growthFromDecisions = Math.round(G.currentDau * 0.6);
  let growthRate = baseGrowth + growthFromDecisions;

  // 口碑乘数：更细分的分档，减小极端翻倍效果
  let repMod = 1.0;
  if (G.rep >= 65) repMod = 1.15;
  else if (G.rep >= 60) repMod = 1.10;
  else if (G.rep >= 50) repMod = 1.05;
  else if (G.rep >= 40) repMod = 1.00;
  else if (G.rep >= 30) repMod = 0.90;
  else if (G.rep >= 20) repMod = 0.80;
  else repMod = 0.60;
  growthRate = Math.round(growthRate * repMod);

  // 爆肝惩罚：只有在明显高爆肝时才强力惩罚
  if (G.grind > 35) {
    growthRate -= Math.round((G.grind - 35) * 0.7);
  }

  // 限制增长区间，避免单阶段增长过高或过低
  growthRate = Math.max(-12, Math.min(70, Math.round(growthRate)));

  let dauBefore = G.dau;
  G.dau = Math.floor(G.dau * (1 + growthRate / 100));
  G.dau = Math.max(1000, G.dau);

  G.rep = Math.max(0, Math.min(100, G.rep + G.currentRep));
  G.grind = Math.max(0, Math.min(100, G.grind + G.currentGrind));

  // 运维成本：按当前日活抽取一定比例的日常开销，增加资金消耗的现实感
  let opCost = Math.floor(G.dau * 0.05); // 每阶段消耗约 5% 的日活对应成本（可调）
  G.fund = Math.max(0, G.fund + G.currentFund - opCost);

  // 处理隐藏事件
  let hiddenFeedback = '';
  if (G._pendingHiddenEvents && G._pendingHiddenEvents.length > 0) {
    G._pendingHiddenEvents.forEach(ev => {
      if (ev.dau) G.dau = Math.floor(G.dau * (1 + ev.dau / 100));
      if (ev.rep) G.rep = Math.max(0, Math.min(100, G.rep + ev.rep));
      if (ev.grind) G.grind = Math.max(0, Math.min(100, G.grind + ev.grind));
      if (ev.fund) G.fund = Math.max(0, G.fund + ev.fund);
      hiddenFeedback += ev.text + '\n';
    });
    G._pendingHiddenEvents = [];
  }

  let period = Math.floor(G.round / G.phaseSize);
  document.getElementById('settlement-period').textContent = `第 ${period} 次运营结算`;

  // 生成本期反馈
  let feedback = '';
  if (approved.length > rejected.length) {
    feedback += '🟢 你倾向于「同意」提案，这个月团队很忙碌。';
  } else if (rejected.length > approved.length) {
    feedback += '🔵 你倾向于「拒绝」提案，这个月团队在稳步观望。';
  } else {
    feedback += '🟡 你有选择地通过了一些提案，保持了平衡。';
  }
  feedback += '\n\n';

  // 按指标生成反馈
  let dauPct = growthRate >= 0 ? '+' + growthRate : growthRate;
  if (growthRate > 5) feedback += `• 日活强劲增长（${dauPct}%），${formatNum(dauBefore)} → ${formatNum(G.dau)}，玩家基数在扩大。 🚀\n`;
  else if (growthRate >= 0) feedback += `• 日活小幅增长（${dauPct}%），${formatNum(dauBefore)} → ${formatNum(G.dau)}，增长势头平稳。\n`;
  else if (growthRate > -5) feedback += `• 日活略有下滑（${dauPct}%），需要关注用户留存。\n`;
  else feedback += `• 日活显著下降（${dauPct}%），玩家在流失！ ⚠️\n`;

  if (G.currentRep > 0) feedback += `• 玩家口碑改善（+${G.currentRep}），社区氛围向好。 ✨\n`;
  else if (G.currentRep < 0) feedback += `• 口碑下滑（${G.currentRep}），玩家开始有怨言了。 ⚠️\n`;
  else feedback += `• 口碑水平没有明显变化。\n`;

  if (G.currentGrind > 0) feedback += `• 爆肝度上升（+${G.currentGrind}），玩家负担加重。\n`;
  else if (G.currentGrind < 0) feedback += `• 爆肝度下降（${G.currentGrind}），玩家轻松了不少。 😌\n`;
  else feedback += `• 爆肝程度保持稳定。\n`;

  if (G.currentFund > 0) feedback += `• 资金流入（+${formatNum(G.currentFund)}），财务表现良好。 💰\n`;
  else if (G.currentFund < 0) feedback += `• 资金支出（${formatNum(G.currentFund)}），预算需要控制。\n`;
  else feedback += `• 收支基本平衡。\n`;

  // 特殊事件
  if (G.grind >= 70) feedback += `\n⚠️ 警告：爆肝度过高！玩家开始抱怨"跟上班一样"。`;
  if (G.rep <= 20) feedback += `\n💀 口碑跌入谷底！社区正在失去信任。`;
  if (G.fund <= 5000) feedback += `\n💰 资金紧张！需要开源节流。`;

  let fbEl = document.getElementById('settlement-feedback');
  let displayFeedback = feedback + (hiddenFeedback ? '\n' + hiddenFeedback : '');
  fbEl.innerHTML = displayFeedback.replace(/\n/g, '<br>');

  // 变化数值（日活显示增长率，其他为累计变化值）
  let dauLabel = growthRate >= 0 ? '+' + growthRate + '%' : growthRate + '%';
  let dauColor = growthRate > 5 ? 'var(--green)' : growthRate >= 0 ? 'var(--text2)' : 'var(--red)';
  let changesHtml = `
    <div class="item"><div class="label">日活增长率</div><div class="num" style="color:${dauColor}">${dauLabel}</div></div>
    <div class="item"><div class="label">口碑</div><div class="num" style="color:${G.currentRep >= 0 ? 'var(--green)' : 'var(--red)'}">${G.currentRep >= 0 ? '+' : ''}${G.currentRep}</div></div>
    <div class="item"><div class="label">爆肝</div><div class="num" style="color:${G.currentGrind > 0 ? 'var(--red)' : G.currentGrind < 0 ? 'var(--green)' : 'var(--text)'}">${G.currentGrind >= 0 ? '+' : ''}${G.currentGrind}</div></div>
    <div class="item"><div class="label">资金变动</div><div class="num" style="color:${(G.currentFund - opCost) >= 0 ? 'var(--green)' : 'var(--red)'}">${(G.currentFund - opCost) >= 0 ? '+' : ''}${formatNum(G.currentFund - opCost)}</div></div>
    <div class="item"><div class="label">运维成本</div><div class="num" style="color:var(--text2)">-${formatNum(opCost)}</div></div>
  `;
  document.getElementById('settlement-changes').innerHTML = changesHtml;

  // 重置累积值
  G.currentDau = 0;
  G.currentRep = 0;
  G.currentGrind = 0;
  G.currentFund = 0;
  G.phaseDecisions = [];

  renderDash();
  document.getElementById('settlement').classList.add('show');
}

function closeSettlement() {
  document.getElementById('settlement').classList.remove('show');
  G.showResult = false;

  let currentPhase = Math.floor(G.round / G.phaseSize);
  if (currentPhase >= G.totalRounds) {
    determineEnding();
  } else {
    showProposal();
  }
}

// ============================================================
// 结局
// ============================================================
const ENDINGS = {
  HIDDEN: { id:'END_HIDDEN', title:'真·顶级制作人', badge:'🏆', desc:'热度、口碑、商业化达到了完美的平衡。你的游戏既叫好又叫座，玩家心甘情愿地留下来，公司也赚得盆满钵满。这，就是顶级策划的实力。' },
  HOME: { id:'END_HOME', title:'第二故乡', badge:'🏡', desc:'玩家不再是为了打卡而上线——他们是真的想回来看看。你的游戏成了很多人生活的一部分，一个随时可以回去的家。' },
  GOOD: { id:'END_GOOD', title:'心流自愿', badge:'🎉', desc:'你的游戏让玩家感到"不累"，日活健康增长，口碑稳步上升。这就是可持续运营。' },
  LOVEHATE: { id:'END_LOVEHATE', title:'被绑架的热爱', badge:'🔥', desc:'玩家一边骂太肝了，一边忍不住上线——你的游戏让他们又爱又恨。这种热度能维持多久，你心里也没底。' },
  NICHE: { id:'END_NICHE', title:'曲高和寡', badge:'🎭', desc:'口碑极佳，但玩的人寥寥无几——"叫好不叫座"。你翻着评论区的"神作"评价，看着可怜的DAU数据，陷入了沉思。' },
  NORMAL: { id:'END_NORMAL', title:'平淡是真', badge:'👍', desc:'数据合格，但总觉得少了点什么。玩家还在，热情却不在了。' },
  BAD: { id:'END_BAD', title:'温水煮青蛙', badge:'💔', desc:'游戏还在运行，但你已经感觉到了下坡路的加速度。' },
  CRASH_REP: { id:'END_CRASH_REP', title:'众叛亲离', badge:'💀', desc:'口碑崩盘，玩家用脚投票。你看着1.2分的评分，想起了当年的自己。' },
  CRASH_GRIND: { id:'END_CRASH_GRIND', title:'爆肝地狱', badge:'☠️', desc:'日常任务堆成山，玩家终于崩溃了。"我到底是在玩游戏还是在上夜班？"' },
  CRASH_FUND: { id:'END_CRASH_FUND', title:'资金断裂', badge:'💸', desc:'资金链断了，公司账上只剩三位数。明天服务器就要到期了。' },
};

function determineEnding() {
  if (G.ended) return;
  G.ended = true;

  let endingId;
  // 改进后的结局判定：更平滑的门槛，资金和爆肝也更易影响结局
  if (G.rep >= 65 && G.dau >= 60000 && G.grind <= 35 && G.fund >= 50000) endingId = 'END_HIDDEN';
  else if (G.rep >= 60 && G.dau >= 40000 && G.grind <= 45) endingId = 'END_HOME';
  else if (G.rep >= 55 && G.dau >= 30000 && G.grind <= 50) endingId = 'END_GOOD';
  else if (G.rep >= 50 && G.dau >= 30000) endingId = 'END_LOVEHATE';
  else if (G.rep >= 55 && G.dau < 20000) endingId = 'END_NICHE';
  else if (G.rep <= 20) endingId = 'END_CRASH_REP';
  else if (G.grind >= 75) endingId = 'END_CRASH_GRIND';
  else if (G.fund <= 1000) endingId = 'END_CRASH_FUND';
  else if (G.dau >= 22000) endingId = 'END_NORMAL';
  else endingId = 'END_BAD';

  G.endingId = endingId;
  let end = ENDINGS[endingId.replace('END_','')] || ENDINGS.NORMAL;

  document.getElementById('ending-badge').textContent = end.badge;
  document.getElementById('ending-title').textContent = end.title;
  document.getElementById('ending-id').textContent = `结局编号: ${end.id}`;
  document.getElementById('ending-desc').textContent = end.desc;

  let statsHtml = `
    <div class="ending-stat"><div class="label">最终日活</div><div class="value" style="color:var(--gold)">${formatNum(G.dau)}</div></div>
    <div class="ending-stat"><div class="label">最终口碑</div><div class="value" style="color:${G.rep >= 55 ? 'var(--green)' : 'var(--red)'}">${G.rep}</div></div>
    <div class="ending-stat"><div class="label">爆肝强度</div><div class="value" style="color:${G.grind > 60 ? 'var(--red)' : 'var(--green)'}">${G.grind}</div></div>
    <div class="ending-stat"><div class="label">剩余资金</div><div class="value">${formatNum(G.fund)}</div></div>
  `;
  document.getElementById('ending-stats').innerHTML = statsHtml;

  // 预留接口：达成率
  document.getElementById('ending-pct').textContent = '--';

  document.getElementById('game').classList.remove('show');
  document.getElementById('ending').classList.add('show');
}

// ============================================================
// 开场 & 标题
// ============================================================
const OPENING_TEXT = `上一世，你负责的游戏由于任务过于繁重，
玩家吐槽"像上班"，纷纷退游，
游戏在一周年前一天关服跑路。

在被扫地出门前，你两眼一黑，
再睁眼，竟穿越回了开服的前一天！

这一次，每一个决策都将改变游戏的命运。
但你永远看不到决策的即时后果——
就像现实中的策划一样。`;

let openingTimer = null;
let skipFlag = false;

function showOpening() {
  let screen = document.getElementById('opening');
  screen.classList.add('show');
  typeText(0);
}

function typeText(idx) {
  if (skipFlag) return;
  let el = document.getElementById('opening-text');
  if (idx <= OPENING_TEXT.length) {
    el.innerHTML = OPENING_TEXT.substring(0, idx) + '<span class="cursor">|</span>';
    openingTimer = setTimeout(() => typeText(idx + 1), 30);
  } else {
    el.innerHTML = OPENING_TEXT;
    setTimeout(() => { if (!skipFlag) goToTitle(); }, 1200);
  }
}

function skipOpening() {
  skipFlag = true;
  if (openingTimer) clearTimeout(openingTimer);
  goToTitle();
}

function goToTitle() {
  let screen = document.getElementById('opening');
  screen.classList.add('hide');
  setTimeout(() => {
    screen.classList.remove('show', 'hide');
    document.getElementById('title').classList.add('show');
    setTimeout(() => document.getElementById('name-input').focus(), 200);
  }, 400);
}

function startGame() {
  let name = document.getElementById('name-input').value.trim() || '天才策划';
  initState(name);
  document.getElementById('title').classList.remove('show');
  document.getElementById('game').classList.add('show');
  renderDash();
  showProposal();
}

function restartGame() {
  document.getElementById('ending').classList.remove('show');
  document.getElementById('game').classList.remove('show');
  document.getElementById('title').classList.add('show');
  document.getElementById('name-input').focus();
}

// ============================================================
// 手机触屏滑动支持
// ============================================================
let _touchStartX = 0;
let _touchStartY = 0;
let _touchMoved = false;

function initSwipe() {
  let card = document.getElementById('proposal-card');
  card.addEventListener('touchstart', function(e) {
    if (G.ended || G.showResult || _pendingFeedback) return;
    _touchStartX = e.touches[0].clientX;
    _touchStartY = e.touches[0].clientY;
    _touchMoved = false;
    // 移除之前的过渡，让拖拽跟随手指
    this.style.transition = 'none';
  }, { passive: true });

  card.addEventListener('touchmove', function(e) {
    if (G.ended || G.showResult || _pendingFeedback) return;
    if (_touchStartX === 0) return;
    let dx = e.touches[0].clientX - _touchStartX;
    let dy = e.touches[0].clientY - _touchStartY;
    // 只处理水平滑动（排除垂直滚动）
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
      _touchMoved = true;
      // 跟随手指位移 + 旋转
      let rotate = Math.max(-20, Math.min(20, dx / 8));
      this.style.transform = `translateX(${dx}px) rotate(${rotate}deg)`;
      // 边界色提示
      if (dx > 30) {
        this.style.borderColor = 'var(--green)';
      } else if (dx < -30) {
        this.style.borderColor = 'var(--red)';
      } else {
        this.style.borderColor = 'rgba(255,255,255,0.06)';
      }
    }
  }, { passive: true });

  card.addEventListener('touchend', function(e) {
    if (G.ended || G.showResult || _pendingFeedback) return;
    this.style.transition = '';
    this.style.borderColor = 'rgba(255,255,255,0.06)';
    if (!_touchMoved) return;
    let dx = (e.changedTouches[0].clientX - _touchStartX);
    // 滑动距离超过80px判定为有效滑动
    if (dx > 80) {
      swipe('approve');
    } else if (dx < -80) {
      swipe('reject');
    } else {
      // 复位
      this.style.transform = '';
      this.style.opacity = '1';
    }
    _touchStartX = 0;
    _touchStartY = 0;
    _touchMoved = false;
  }, { passive: true });
}

// ============================================================
// 启动
// ============================================================
window.onload = function() {
  initSwipe();
  showOpening();
};
</script>
